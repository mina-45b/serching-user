<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Searching User</title>
    </head>

    <body>
        <section>
            <div class="content">
                <div class="title">
                    <h1>Searching User</h1>
                </div>
                <div class="search-bar">
                    <div class="bar">
                        <i class="bi bi-search"></i>
                        <input type="number" name="idUser"  id="id-user" placeholder="Enter user number">
                    </div>
                    <input type="button" value="Search" id="btn-search">
                </div>
                <div id="user-result">
                    <ul id="user-data">
                    </ul>
                </div>
            </div>
        </section>
        <script src="js/main.js"></script>
    </body>
</html>
